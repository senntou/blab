<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>blab</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧪</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 3h6M10 3v6.5L4.6 18A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-3L14 9.5V3M7.5 15h9" />
        </svg>
        <span>blab</span>
      </a>
      <span id="root-label" class="root-label"></span>
      <nav>
        <a href="#/" data-route="experiments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon" width="16" height="16" aria-hidden="true">
            <path d="M12 3 3 8l9 5 9-5-9-5ZM3 13l9 5 9-5M3 17.5l9 5 9-5" />
          </svg>
          <span>Experiments</span>
        </a>
        <a href="#/components" data-route="components">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon" width="16" height="16" aria-hidden="true">
            <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" />
          </svg>
          <span>Components</span>
        </a>
        <a href="#/compare" data-route="compare">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon" width="16" height="16" aria-hidden="true">
            <path d="M9 4v16M15 4v16M3 8l3-3 3 3M21 16l-3 3-3-3" />
          </svg>
          <span>比較</span>
        </a>
      </nav>
      <button id="refresh-btn" class="btn" type="button" title="表示を更新"></button>
      <span id="refresh-time" class="muted"></span>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="app"></main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
